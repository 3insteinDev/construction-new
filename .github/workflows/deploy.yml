name: Deploy Delicatto

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy no VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/delicatto
            git pull origin main
            docker build -t localhost:5000/delicatto-site:latest .
            docker push localhost:5000/delicatto-site:latest
            docker compose up -d
